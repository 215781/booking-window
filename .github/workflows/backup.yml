name: Price data backup

# Twice-weekly snapshot of ALL price data (every _data/*.csv + email state) as a compressed
# GitHub Release asset, followed by a restore test: the asset is downloaded again, unpacked and
# checked against the original checksums. Keeps the newest 16 snapshots (~8 weeks).
# (Until 6 Oct 2026 this job only saved the obsolete price_history.csv - none of the live data.)

on:
  schedule:
    - cron: "0 2 * * 0,3"   # 02:00 UTC Sunday and Wednesday (GitHub often runs schedules late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build snapshot
        id: snap
        run: |
          set -euo pipefail
          DATE=$(date -u +'%Y-%m-%d')
          TAG="backup-data-${DATE}"
          NAME="whentobook-data-${DATE}.tar.gz"
          ( cd _data && sha256sum *.csv *.json > ../SHA256SUMS )
          tar -czf "$NAME" _data/*.csv _data/*.json SHA256SUMS
          {
            echo "Automated price data snapshot ${DATE} (commit ${GITHUB_SHA::8})."
            echo
            echo "| File | Rows | Size |"
            echo "|---|---|---|"
            for f in _data/*.csv; do
              echo "| $(basename "$f") | $(($(wc -l < "$f") - 1)) | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Restore: download ${NAME}, run \`tar -xzf ${NAME}\` in the repo root, then \`sha256sum -c SHA256SUMS\` inside _data/."
          } > notes.md
          cat notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          set -euo pipefail
          gh release delete "${{ steps.snap.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ steps.snap.outputs.tag }}" "${{ steps.snap.outputs.name }}" \
            --title "Data backup ${{ steps.snap.outputs.tag }}" --notes-file notes.md --prerelease

      - name: Restore test (download, unpack, verify checksums)
        run: |
          set -euo pipefail
          mkdir restore && cd restore
          gh release download "${{ steps.snap.outputs.tag }}" -p "${{ steps.snap.outputs.name }}"
          tar -xzf "${{ steps.snap.outputs.name }}"
          cd _data && sha256sum -c ../SHA256SUMS
          echo "Restore test passed: every file matches the original."

      - name: Keep the newest 16 data snapshots
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate -q '.[].tag_name' \
            | grep '^backup-data-' | sort -r | tail -n +17 | while read -r t; do
              echo "Removing old snapshot $t"
              gh release delete "$t" --yes --cleanup-tag
            done
