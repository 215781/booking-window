name: Club Med Summer Price Checker

on:
  schedule:
    - cron: "30 7 * * *"    # 07:30 UTC daily — separate from winter checker (06:00 UTC)
  workflow_dispatch:        # manual trigger available from GitHub Actions tab

permissions:
  contents: write

jobs:
  check-summer-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # each batch ~1,600 queries at concurrency 4 (rolling Apr-Oct year ahead, 3 party sizes)
    strategy:
      fail-fast: false
      max-parallel: 1       # run batches one after another so CSV commits never collide
      matrix:
        batch: [0, 1, 2]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # latest main, so batch 2 and 3 start after batch 1's commits (not the run's start commit)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Run summer price checker
        env:
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_TO:       ${{ secrets.ALERT_TO }}
        run: python clubmed_summer_checker.py --batch ${{ matrix.batch }} --batches 3

      - name: Commit updated CSV (safety net)
        # Per-resort commits happen inside the checker; this catches anything that slipped through.
        if: always()
        run: |
          git config user.name  "Booking Window Bot"
          git config user.email "bot@bookingwindow.co.uk"
          git pull --rebase origin main || true
          git add _data/prices_clubmed_summer.csv
          git diff --staged --quiet || git commit -m "data: club med summer prices $(date +%Y-%m-%d) batch ${{ matrix.batch }} [safety net]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main || true
